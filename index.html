<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LUDO PRO : Realtime Multiplayer & Smart AI</title>
    <meta name="description" content="A high performance digital Ludo board game featuring Solo vs Smart AI, Local Pass and Play, and realtime P2P WebRTC online rooms." />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body class="bg-[#f8fafc] text-slate-900 antialiased select-none">
    <div id="app" class="relative min-h-[100dvh] w-full flex flex-col justify-between items-center bg-[#f8fafc]">
      
      <!-- SCREEN 1: Primary Executive Game Dashboard -->
      <div id="dashboard-screen" class="w-full flex-1 flex flex-col justify-start"></div>

      <!-- SCREEN 2: Active In-Game Arena Screen -->
      <div id="game-screen" class="hidden w-full min-h-[100dvh] max-h-[100dvh] h-[100dvh] flex-1 flex flex-col justify-between items-center overflow-hidden bg-zinc-950 text-zinc-100">
        <!-- Top Game Header Bar -->
        <header class="w-full max-w-5xl mx-auto px-3 py-1.5 sm:py-2 flex items-center justify-between z-20 shrink-0">
          <div class="flex items-center gap-2">
            <button id="btn-back-dashboard" class="p-1.5 sm:p-2 rounded-xl bg-zinc-900/90 border border-zinc-800 hover:border-zinc-700 text-zinc-300 hover:text-white transition-all shadow-sm active:scale-95 flex items-center gap-1 text-[11px] sm:text-xs font-bold font-mono" title="Back to Dashboard">
              <span>🏠</span>
              <span class="hidden xs:inline sm:inline">Menu</span>
            </button>
            <div>
              <h1 class="font-black text-sm sm:text-base leading-tight tracking-tight text-white flex items-center gap-1.5">
                LUDO <span class="text-[9px] sm:text-[10px] uppercase font-bold tracking-widest px-1.5 py-0.2 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20">PRO</span>
              </h1>
              <p id="game-mode-badge" class="text-[10px] sm:text-xs text-zinc-400 font-mono">Vs Computer (AI)</p>
            </div>
          </div>

          <div class="flex items-center gap-1.5 sm:gap-2">
            <!-- Room Code Badge (Shown during online match) -->
            <div id="room-badge-container" class="hidden items-center gap-1.5 bg-zinc-900/90 border border-blue-500/30 rounded-xl px-2 sm:px-3 py-1 text-[10px] sm:text-xs font-mono text-zinc-300 shadow-sm">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>ROOM: <strong id="room-code-display" class="text-blue-400 tracking-wider">------</strong></span>
              <button id="copy-room-btn" class="ml-0.5 text-zinc-400 hover:text-white transition-colors" title="Copy Room Link">
                📋
              </button>
            </div>

            <!-- Sound Toggle -->
            <button id="sound-toggle-btn" class="p-1.5 sm:p-2 rounded-xl bg-zinc-900/90 border border-zinc-800 hover:border-zinc-700 text-zinc-300 hover:text-white transition-all shadow-sm active:scale-95 text-xs sm:text-sm" title="Toggle Sound">
              🔊
            </button>

            <!-- Reset / Rematch Match Menu -->
            <button id="restart-match-btn" class="px-2.5 py-1.5 rounded-xl bg-zinc-900/90 hover:bg-zinc-800 border border-zinc-700/80 text-[11px] sm:text-xs font-semibold text-zinc-200 hover:text-white transition-all active:scale-95 shadow-sm">
              🔄 Reset
            </button>
          </div>
        </header>

        <!-- Mobile Player Mini Indicators Strip (Top) -->
        <div id="mobile-players-strip" class="flex md:hidden items-center justify-center gap-1.5 w-full px-2 py-0.5 shrink-0 overflow-x-auto no-scrollbar z-10"></div>

        <!-- Central Board Viewport & Player HUD Layout -->
        <main class="w-full flex-1 flex flex-col md:flex-row items-center justify-center gap-2 md:gap-4 px-2 py-0 max-w-6xl mx-auto relative z-10 min-h-0">
          <!-- Turn & Player Status Tray Left (Red & Blue) -->
          <div id="turn-sidebar-left" class="hidden md:flex flex-col gap-3 w-52 shrink-0">
            <div id="player-card-0" class="player-hud-card"></div>
            <div id="player-card-3" class="player-hud-card"></div>
          </div>

          <!-- Central Board Viewport -->
          <div class="relative flex flex-col items-center justify-center shrink-0">
            <div id="board-container" class="board-wrapper relative rounded-2xl md:rounded-3xl p-1.5 sm:p-2.5 md:p-3.5 border border-zinc-800/80 shadow-2xl backdrop-blur-xl">
              <!-- Dynamic SVG Render Target -->
              <div id="board-viewport" class="relative"></div>
            </div>

            <!-- Active Turn Banner -->
            <div id="turn-banner" class="mt-1 md:mt-2 text-center text-[11px] sm:text-xs font-medium text-zinc-300 h-5 md:h-6 flex items-center justify-center gap-1.5">
              <span id="turn-banner-avatar"></span>
              <span id="turn-banner-text">Loading match...</span>
            </div>
          </div>

          <!-- Turn & Player Status Tray Right (Green & Yellow) -->
          <div id="turn-sidebar-right" class="hidden md:flex flex-col gap-3 w-52 shrink-0">
            <div id="player-card-1" class="player-hud-card"></div>
            <div id="player-card-2" class="player-hud-card"></div>
          </div>
        </main>

        <!-- Bottom Interactive Controls & 3D Dice Dock -->
        <footer class="w-full max-w-4xl mx-auto px-3 pb-2 pt-0.5 z-20 shrink-0 flex flex-col items-center gap-1.5">
          <div class="flex items-center justify-center gap-2 sm:gap-4 w-full flex-wrap sm:flex-nowrap">
            <!-- Emote Reaction Quick Bar -->
            <div id="emote-container" class="flex items-center justify-center"></div>

            <!-- 3D Interactive Dice Hub -->
            <div id="dice-hub" class="flex items-center gap-3 sm:gap-4 bg-zinc-900/90 border border-zinc-800/90 rounded-2xl px-3.5 sm:px-5 py-1.5 sm:py-2.5 shadow-xl backdrop-blur-md">
              <div id="dice-cube-container" class="dice-scene cursor-pointer" title="Click or Tap to Roll">
                <div id="dice-cube" class="dice-cube">
                  <div class="dice-face front">1</div>
                  <div class="dice-face back">6</div>
                  <div class="dice-face right">3</div>
                  <div class="dice-face left">4</div>
                  <div class="dice-face top">2</div>
                  <div class="dice-face bottom">5</div>
                </div>
              </div>

              <div class="flex flex-col items-start">
                <span id="dice-hint" class="text-[10px] sm:text-[11px] font-mono uppercase tracking-wider text-rose-400 font-bold">Your Turn</span>
                <button id="roll-dice-btn" class="px-4 sm:px-5 py-1.5 rounded-xl bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-400 hover:to-rose-500 text-white font-black text-xs shadow-lg shadow-rose-500/25 active:scale-95 transition-all">
                  ROLL DICE
                </button>
              </div>
            </div>
          </div>
        </footer>
      </div>

      <!-- Modals Container -->
      <div id="modal-overlay" class="modal-overlay hidden">
        <div id="lobby-modal" class="modal-card hidden"></div>
        <div id="victory-modal" class="modal-card hidden"></div>
      </div>
    </div>

    <!-- Application Script -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
